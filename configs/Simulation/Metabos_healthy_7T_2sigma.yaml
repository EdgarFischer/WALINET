version: 2

description: >
  WALINET metabolite concentration configuration. Metabolites are
  sampled independently from a common positive mixture model consisting
  of a zero-truncated normal component and a lognormal component.
  The mixture weights are fixed globally in the simulation code and are
  not configured separately for individual metabolites.

sampling:
  independent: true
  default_distribution: positive_mixture


metabolites:

  Act:
    enabled: false
    basis_component: Act
    distribution:
      type: positive_mixture

      normal:
        mean: null
        std: null

      lognormal:
        log_mu: null
        log_sigma: null

      minimum: 0.0


