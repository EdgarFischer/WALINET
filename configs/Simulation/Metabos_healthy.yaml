version: 1

description: >
  WALINET metabolite concentration configuration based on the original
  simulation parameters. Metabolites are sampled independently from
  Gaussian distributions and clipped at zero.

sampling:
  independent: true
  default_distribution: normal
  clip_negative_values: true
  minimum_concentration: 0.0

metabolites:

  GPC:
    enabled: true
    basis_component: GPC
    distribution:
      type: normal
      mean: 0.5
      std: 0.5

  Glu:
    enabled: true
    basis_component: Glu
    distribution:
      type: normal
      mean: 8.0
      std: 6.5

  NAA:
    enabled: true
    basis_component: NAA
    distribution:
      type: normal
      mean: 10.0
      std: 7.0

  PCr:
    enabled: true
    basis_component: PCr
    distribution:
      type: normal
      mean: 2.0
      std: 1.5

  Scy:
    enabled: true
    basis_component: Scyllo
    distribution:
      type: normal
      mean: 0.5
      std: 0.5

  Cr:
    enabled: true
    basis_component: Cr
    distribution:
      type: normal
      mean: 6.0
      std: 5.5

  Glc:
    enabled: true
    basis_component: Glc
    distribution:
      type: normal
      mean: 1.5
      std: 1.0

  NAAG:
    enabled: true
    basis_component: NAAG
    distribution:
      type: normal
      mean: 1.0
      std: 0.5

  Gln:
    enabled: true
