      mean: 5.0
      std: 4.5

  Tau:
    enabled: true
    basis_component: Tau
    distribution:
      type: normal
      mean: 1.5
      std: 1.0

  GSH:
    enabled: true
    basis_component: GSH
    distribution:
      type: normal
      mean: 1.5
      std: 1.0

  Asp:
