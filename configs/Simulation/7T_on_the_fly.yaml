version: "simulation_v4"


acquisition:
  bandwidth_hz: 2778.0

  # Fixed internal and output length after zero-filling.
  n_timepoints: 840

  # Actually acquired FID samples before zero-filling.
  min_acquired_n_timepoints: 558
  max_acquired_n_timepoints: 840

  # Larmor frequency of the acquisition.
  #
  # Used by the configuration builder to convert ppm-based
  # frequency parameters into the simulator's internal unit Hz.
  #
  # hz_per_ppm = nmr_frequency_hz / 1e6
  nmr_frequency_hz: 297222931


basis:
  library: "../../MetabModes/LCModelBasis/processed/7T_basis_tumor_v1.h5"


metabolites:
  profiles:
    - config: "Metabos_healthy.yaml"
      probability: 1.0

  # Global frequency shift in ppm.
  #
  # Internally converted to Hz by the configuration builder.
  frequency_shift:
    mean_ppm: 0.00598877
    std_ppm: 0.17798088

  # Spectral FWHM in ppm.
  #
  # Internally converted to Hz by the configuration builder.
  fwhm:
    mean_ppm: 0.05585033
    std_ppm: 0.12179410

  # Frequency-independent global phase rotation.
  #
  # Internally converted from degrees to radians.
  zero_order_phase:
    mean_deg: -12.03211370
    std_deg: 69.90085101

  # Linear phase slope over frequency.
  #
  # Internally converted from deg/ppm to rad/Hz.
  first_order_phase:
    mean_deg_per_ppm: 0.0
    std_deg_per_ppm: 34.05923904


noise:
  # LCModel-compatible target S/N:
  #
  # S/N = maximum metabolite peak /
  #       (2 * RMS(receiver noise))
  snr:
    mean: 9
    std: 14
    min: 1.0


water:
  scaling:
    mean: 15.0
    std: 25.0


lipids:
  n_random_fids: 10

  scaling:
    mean: 2
    std: 17.475


subject_sampling:
  mixing: "same_subject"


lipid_projection:
  enabled: true