version: "simulation_v4"


acquisition:
  bandwidth_hz: 2778.0

  # Fixed internal and output length after zero-filling.
  n_timepoints: 840

  # Actually acquired FID samples before zero-filling.
  min_acquired_n_timepoints: 558
  max_acquired_n_timepoints: 840

  # Larmor frequency of the acquisition.
  # This value is not used during simulation.
  # It is stored for documentation purposes and to enable Hz↔ppm
  # conversions for visualization, analysis, and interfacing with LCModel.
  nmr_frequency_hz: 297222931


basis:
  library: "../../MetabModes/LCModelBasis/processed/7T_basis_tumor_v1.h5"


metabolites:
  profiles:
    - config: "Metabos_healthy.yaml"
      probability: 1.0

  frequency_shift:
    mean_hz: 0.0
    std_hz: 5.0

  fwhm:
    mean_hz: 15.0
    std_hz: 8.0

  # Frequency-independent global phase rotation applied only to the
  # simulated metabolite signal.
  #
  # phi_0 ~ Normal(mean_rad, std_rad)
  zero_order_phase:
    mean_rad: 0.0
    std_rad: 0.15

  # Linear phase slope over frequency, applied only to the simulated
  # metabolite spectrum.
  #
  # phi(f) = phi_0 + phi_1 * f
  #
  # phi_1 is expressed in rad/Hz, so that:
  #   phi_1 [rad/Hz] * f [Hz] = phase [rad]
  first_order_phase:
    mean_rad_per_hz: 0.0
    std_rad_per_hz: 0.00025


noise:
  # LCModel-compatible target S/N:
  #
  # S/N = maximum metabolite peak /
  #       (2 * RMS(receiver noise))
  #
  # S/N is sampled from a normal distribution. Unlike the other
  # normally distributed parameters, it has an explicit lower bound
  # because the required noise amplitude diverges as S/N approaches zero.
  snr:
    mean: 5.5
    std: 2.25
    min: 1.0


water:
  scaling:
    mean: 15.0
    std: 25.0


lipids:
  n_random_fids: 10

  scaling:
    mean: 35.05
    std: 17.475


subject_sampling:
  mixing: "same_subject"


lipid_projection:
  enabled: false