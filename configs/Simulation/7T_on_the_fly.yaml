version: "simulation_v2"

acquisition:
  bandwidth_hz: 2778.0

  # Fixed internal and output length.
  # Every final spectrum contains 840 frequency points.
  n_timepoints: 840

  # Number of actually acquired FID samples.
  # One integer is sampled independently for every spectrum.
  min_acquired_n_timepoints: 558
  max_acquired_n_timepoints: 840

  nmr_frequency_hz: 297222931.0

basis:
  config: "Basis_7T.yaml"

metabolites:
  config: "Metabos.yaml"

  max_acquisition_delay_seconds: 0.002
  max_frequency_shift_hz: 40.0

  line_broadening:
    min: 10.0
    max: 100.0
    gaussian_fraction_min: 0.0
    gaussian_fraction_max: 1.0

noise:
  snr_min: 1.0
  snr_max: 10.0

water:
  scaling_min: 0.1
  scaling_max: 110.0

lipids:
  n_random_fids: 10

  scaling_min: 0.1
  scaling_max: 70.0
  scaling_distribution: "log_uniform"

subject_sampling:
  mixing: "same_subject"

lipid_projection:
  enabled: false