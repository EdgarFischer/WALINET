version: "simulation_v4"

acquisition:
  bandwidth_hz: 2778.0

  # Fixed internal and output length.
  n_timepoints: 840

  # Actually acquired FID samples before zero-filling.
  min_acquired_n_timepoints: 558
  max_acquired_n_timepoints: 840

  nmr_frequency_hz: 297222931.0


basis:
  library: "../../MetabModes/LCModelBasis/processed/7T_basis_tumor_v1.h5"


metabolites:
  profiles:
    - config: "Metabos_healthy.yaml"
      probability: 1.0

  max_acquisition_delay_seconds: 0.002

  frequency_shift:
    mean_hz: 0.0
    std_hz: 5.0

  fwhm:
    mean_hz: 15.0
    std_hz: 8.0


noise:
  snr_min: 1.0
  snr_max: 10.0


water:
  scaling_mean: 15.0
  scaling_std: 25.0


lipids:
  n_random_fids: 10

  scaling_min: 0.1
  scaling_max: 70.0


subject_sampling:
  mixing: "same_subject"


lipid_projection:
  enabled: false