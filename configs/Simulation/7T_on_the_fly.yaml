version: "simulation_v4"


acquisition:
  bandwidth_hz: 2778.0

  # Fixed internal and output length after zero-filling.
  n_timepoints: 840

  # Actually acquired FID samples before zero-filling.
  min_acquired_n_timepoints: 558
  max_acquired_n_timepoints: 840

  nmr_frequency_hz: 297222931.0


basis:
  library: "../../MetabModes/LCModelBasis/processed/7T_basis_tumor_v1.h5"


metabolites:
  profiles:
    - config: "Metabos_healthy.yaml"
      probability: 1.0

  max_acquisition_delay_seconds: 0.002

  frequency_shift:
    mean_hz: 0.0
    std_hz: 5.0

  fwhm:
    mean_hz: 15.0
    std_hz: 8.0


noise:
  # LCModel-compatible target S/N:
  #
  # S/N = maximum metabolite peak /
  #       (2 * RMS(receiver noise))
  #
  # S/N is sampled from a normal distribution. Unlike the other
  # normally distributed parameters, it has an explicit lower bound
  # because the required noise amplitude diverges as S/N approaches zero.
  snr:
    mean: 5.5
    std: 2.25
    min: 1.0


water:
  scaling:
    mean: 15.0
    std: 25.0


lipids:
  n_random_fids: 10

  scaling:
    mean: 35.05
    std: 17.475


subject_sampling:
  mixing: "same_subject"


lipid_projection:
  enabled: false