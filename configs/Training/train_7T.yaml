run:
  name: "7T_Unet_6Layer_558_NoB0Cor_3"
  seed: 42
  gpu: 3

data:
  source: "on_the_fly"  # "on_the_fly" or "precomputed"

  base_dir: "../data/7T/NoB0Correction"
  train_subjects: ['Vol3_Brisbane', 'Vol4_Brisbane', 'Vol5_Brisbane', 'Vol6_Brisbane', 'Vol2_London', 'Vol3_London', 'Vol4_London', 'Vol5_London', 'Vol6', 'Vol7', 'Vol8', 'Vol9']

  val_subjects: ['Vol5', 'Vol1_Brisbane', 'Vol1_London']

  normalization: "max_abs" # projection_energy is pauls style, max_abs does not need the lipid projection operator

  # only used when data source: "on_the_fly"
  simulation_config: "../configs/simulation/7T_on_the_fly.yaml"

  # only used when data source: "precomputed"
  precomputed:
    version: "v_2.0_558"
    train_data_filename: "TrainData_{version}.h5"

output:
  base_dir: "../models"
  overwrite: false

training:
  enabled: true
  batch_size: 3500
  num_workers: 0
  epochs: 300

  # On-the-fly: number of newly simulated batches per epoch.
  # Precomputed: -1 uses all available batches.
  n_batches: 1000 # use all training batches, for precomuted -1 uses all batches
  
  n_val_batches: -1 # use all validation batches
  verbose: false

optim:
  lr: 0.00008

scheduler:
  milestones: [150, 300, 500]
  gamma: 0.25

model:
  architecture: "unet"   # "ynet" or "unet"
  n_layers: 6
  n_filters: 16
  in_channels: 2
  out_channels: 2
  dropout: 0.0

checkpoint:
  preload: true
  preload_model: "/workspace/walinet/models/7T_Unet_6Layer_558_NoB0Cor_2"

prediction:
  enabled: false