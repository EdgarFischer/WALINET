run:
  name: "7T_new_Wali_2"
  seed: 42
  gpu: 3

data:
  base_dir: "../../data/7T/B0corrected_wo_LipidMask"

  train_subjects: ['Vol3_Brisbane'] #, 'Vol4_Brisbane', 'Vol5_Brisbane', 'Vol6_Brisbane', 'Vol2_London', 'Vol3_London', 'Vol4_London', 'Vol5_London', 'Vol6', 'Vol7', 'Vol8', 'Vol9']
  val_subjects: ['Vol5']  #, 'Vol1_Brisbane', 'Vol1_London']

  simulation_config: "../Simulation/7T_on_the_fly.yaml"

  resources:
    version: "water_lipid_v1"
    filename: "TrainData/SimulationResources_{version}.h5"

output:
  base_dir: "../../models"
  overwrite: false

training:
  batch_size: 4000
  epochs: 200

  # Number of newly simulated training batches per epoch.
  n_batches: 200

  # Print information for every individual batch.
  verbose: false

validation:
  # A fixed synthetic validation dataset is generated once at startup
  # and reused after every epoch.
  seed: 12345
  n_spectra: 35000
  batch_size: 3500

optim:
  lr: 0.0008

scheduler:
  milestones: [50, 100, 150]
  gamma: 0.5

model:
  architecture: "unet"  # "unet" or "ynet"
  n_layers: 3
  n_filters: 8
  in_channels: 2
  out_channels: 2
  dropout: 0.0

checkpoint:
  # Loads only model weights from:
  # ../../models/<preload_model>/model_last.pt
  preload: false
  preload_model: "7T_Unet_6Layer_558_NoB0Cor_2"