run:
  name: "7T_Unet_6Layer_558_NoB0Cor_3"
  seed: 42
  gpu: 3

data:
  source: "on_the_fly"  # "on_the_fly" or "precomputed"

  base_dir: "../../data/7T/NoB0Correction"

  train_subjects: ['Vol3_Brisbane', 'Vol4_Brisbane']

  val_subjects: ['Vol1_Brisbane']

  normalization: "max_abs"

  on_the_fly:
    simulation_config: "../Simulation/7T_on_the_fly.yaml"

    resources:
      version: "water_lipid_v1"
      filename: "TrainData/SimulationResources_{version}.h5"

  precomputed:
    version: "v_2.0_558"
    train_data_filename: "TrainData_{version}.h5"

output:
  base_dir: "../models"
  overwrite: false

training:
  enabled: true
  batch_size: 3500
  num_workers: 0
  epochs: 300

  # Number of newly simulated training batches per epoch.
  # Must be finite for on-the-fly simulation.
  n_batches: 1000

  verbose: false

validation:
  # Generate one finite validation dataset once at startup.
  # The same validation samples are reused after every epoch.
  mode: "fixed_on_start"
  seed: 12345
  n_spectra: 35000
  batch_size: 3500

optim:
  lr: 0.00008

scheduler:
  milestones: [150, 300, 500]
  gamma: 0.25

model:
  architecture: "unet"  # "ynet" or "unet"
  n_layers: 6
  n_filters: 16
  in_channels: 2
  out_channels: 2
  dropout: 0.0

checkpoint:
  preload: true
  preload_model: "../models/7T_Unet_6Layer_558_NoB0Cor_2"

prediction:
  enabled: false